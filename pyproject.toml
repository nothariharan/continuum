[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum"
version = "0.0.0"
description = "Continuum Phase 0 HydraDB integration foundation"
requires-python = ">=3.12"
dependencies = ["neo4j>=5.28,<7"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
embed = ["sentence-transformers>=3.0", "numpy>=1.26", "rank-bm25>=0.2"]
extract = ["rapidfuzz>=3.0"]
llm = ["openai>=1.0"]
delivery = ["fastapi>=0.100", "uvicorn>=0.23", "slack-bolt>=1.18", "pydantic>=2.0"]

[tool.setuptools.packages.find]
include = ["continuum*"]

[tool.pytest.ini_options]
markers = [
  "hydradb: requires a running local HydraDB instance",
]
testpaths = ["tests"]
